name: Build and deploy React app to Azure Web App - DariParruca-Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist
            server-entry.mjs
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download application
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_97859617703A4478ACB431F5F53913FE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D56291E8218A4FE6AAC0D8B986550D7E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A9AC1E3AB78D4995843FBD0EFB83C4E7 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'DariParruca-Portfolio'
          slot-name: 'Production'
          package: .
